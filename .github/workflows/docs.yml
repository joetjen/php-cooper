name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build docs
        run: docker run --rm -v "$(pwd):/data" phpdoc/phpdoc:3

      # phpdoc/phpdoc's container runs as root, so doc/ comes back
      # root-owned on the host -- upload-pages-artifact runs as the
      # unprivileged runner user and can't read it without this.
      - name: Fix output ownership
        run: sudo chown -R "$(id -u):$(id -g)" doc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
